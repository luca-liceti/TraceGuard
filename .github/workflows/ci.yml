name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: traceguard-extension/package-lock.json
        
    - name: Install dependencies
      working-directory: ./traceguard-extension
      run: npm ci --legacy-peer-deps

    - name: Security audit
      working-directory: ./traceguard-extension
      run: npm audit --audit-level=high
      
    - name: Run ESLint
      working-directory: ./traceguard-extension
      run: npm run lint

    - name: Run Tests
      working-directory: ./traceguard-extension
      run: npm run test:coverage

    - name: Typecheck
      working-directory: ./traceguard-extension
      run: npm run typecheck
      
    - name: Run Build
      working-directory: ./traceguard-extension
      run: npm run build
