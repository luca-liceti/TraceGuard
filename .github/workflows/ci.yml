name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Use Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: traceguard-extension/package-lock.json
        
    - name: Install dependencies
      working-directory: ./traceguard-extension
      run: npm ci --legacy-peer-deps

    - name: Security audit
      working-directory: ./traceguard-extension
      run: npm audit --audit-level=high
      
    - name: Run ESLint
      working-directory: ./traceguard-extension
      run: npm run lint

    - name: Run Tests
      working-directory: ./traceguard-extension
      run: npm run test:coverage

    - name: Typecheck
      working-directory: ./traceguard-extension
      run: npm run typecheck
      
    - name: Run Build
      working-directory: ./traceguard-extension
      run: npm run build
