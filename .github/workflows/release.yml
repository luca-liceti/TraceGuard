name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    
    - name: Use Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: traceguard-extension/package-lock.json

    - name: Verify tag matches package version
      working-directory: ./traceguard-extension
      env:
        # The ref is passed through the environment instead of being interpolated
        # into the shell string. A crafted tag name could otherwise break out of
        # the quotes and run commands in this job, which holds signing secrets.
        TAG_NAME: ${{ github.ref_name }}
      run: |
        pkg="v$(node -p "require('./package.json').version")"
        if [ "$TAG_NAME" != "$pkg" ]; then
          echo "Tag $TAG_NAME does not match package version $pkg" >&2
          exit 1
        fi

    - name: Install dependencies
      working-directory: ./traceguard-extension
      run: npm ci --legacy-peer-deps
      
    - name: Run Tests
      working-directory: ./traceguard-extension
      run: npm run test:run
      
    - name: Typecheck
      working-directory: ./traceguard-extension
      run: npm run typecheck

    - name: Rebuild phishlist
      working-directory: ./traceguard-extension
      run: npm run build:phishlist

    # The signing key is a repo secret and may be unset on forks. The secrets
    # context is not allowed in if: conditions, so pass it via env and check it
    # inside bash, exporting an output that later steps gate on.
    - name: Check signing key
      id: signing-key
      shell: bash
      env:
        THREAT_SIGNING_KEY: ${{ secrets.THREAT_SIGNING_KEY }}
      run: |
        if [ -n "$THREAT_SIGNING_KEY" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Sign threat feed
      if: steps.signing-key.outputs.available == 'true'
      working-directory: ./traceguard-extension
      env:
        THREAT_SIGNING_KEY: ${{ secrets.THREAT_SIGNING_KEY }}
      run: npm run sign:phishlist

    - name: Build ToS;DR database
      working-directory: ./traceguard-extension
      run: npm run build:tosdr

    - name: Build extension
      working-directory: ./traceguard-extension
      run: npx vite build
      
    - name: Package Extension
      working-directory: ./traceguard-extension
      env:
        TAG_NAME: ${{ github.ref_name }}
      run: |
        cd dist
        zip -r "../traceguard-extension-${TAG_NAME}.zip" ./*
        
    - name: Extract release notes
      run: awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md

    - name: Create Release
      uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1
      with:
        name: ${{ github.ref_name }}
        body_path: release-notes.md
        files: |
          traceguard-extension/traceguard-extension-${{ github.ref_name }}.zip
          traceguard-extension/src/assets/phishlist.signed.json

    # Store credentials may be unset on forks, so gate the upload on their
    # presence (the secrets context is not allowed in if: conditions).
    - name: Check store credentials
      id: store-creds
      env:
        CLIENT_ID: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
      run: |
        if [ -n "$CLIENT_ID" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload to Chrome Web Store
      if: steps.store-creds.outputs.available == 'true'
      working-directory: ./traceguard-extension
      env:
        CLIENT_ID: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
        REFRESH_TOKEN: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
        EXTENSION_ID: ${{ vars.EXTENSION_ID }}
      run: npm run upload:store
